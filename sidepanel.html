<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Digest</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Note: the panel's own "YouTube Digest" title is shown by Chrome's side-panel
         title bar, so we don't repeat a logo here. -->
    <div class="header">
      <div class="header-top">
        <!-- Video info -->
        <div class="video-info" id="videoInfo" style="display: none">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-channel" id="videoChannel"></div>
        </div>
        <div class="header-actions">
          <button
            class="settings-btn"
            id="settingsBtn"
            type="button"
            title="打开 YouTube Digest 设置"
            aria-label="打开 YouTube Digest 设置"
          >
            Settings
          </button>
        </div>
      </div>

      <!-- Tab navigation -->
      <div class="tabs" id="tabsNav" style="display: none">
        <button class="tab active" data-tab="transcript">Transcript</button>
        <button class="tab" data-tab="overview">Overview</button>
        <button class="tab" data-tab="notes">Notes</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content" id="contentArea">
      <!-- WELCOME STATE -->
      <div id="welcomeState" class="welcome-container">
        <div class="welcome-icon" aria-hidden="true"></div>
        <div class="welcome-title">准备开始整理</div>
        <div class="welcome-desc">
          打开一个 YouTube 视频并点击扩展图标，即可获取人工智能生成的深度学习资料。
        </div>
      </div>

      <!-- LOADING STATE -->
      <div id="loadingState" style="display: none">
        <div class="loading-container">
          <div class="loading-bar"></div>
          <div class="loading-text" id="loadingText">正在获取字幕</div>
          <div class="loading-subtext" id="loadingSubtext">
            正在从视频中提取字幕……
          </div>
        </div>
      </div>

      <!-- ERROR STATE -->
      <div id="errorState" style="display: none">
        <div class="error-container">
          <div class="error-icon" aria-hidden="true">!</div>
          <div class="error-title" id="errorTitle">出错了</div>
          <div class="error-message" id="errorMessage">
            出现了一些问题。
          </div>
          <button class="error-btn" id="errorBtn">重试</button>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="resultsState" style="display: none">
        <!-- TAB: Transcript (default - no LLM required) -->
        <div class="tab-panel active" data-panel="transcript">
          <div class="section">
            <div class="section-header transcript-section-header">
              <div class="section-title-wrap">
                <div class="section-title">完整字幕</div>
                <div
                  class="transcript-mode-control"
                  id="transcriptModeControl"
                  role="group"
                  aria-label="Transcript 显示语言"
                  data-language-surface="transcript"
                >
                  <button class="transcript-mode-btn active" type="button" data-transcript-mode="original" aria-pressed="true">Original</button>
                  <button class="transcript-mode-btn" type="button" data-transcript-mode="zh" aria-pressed="false">中文</button>
                  <button class="transcript-mode-btn" type="button" data-transcript-mode="bilingual" aria-pressed="false">双语</button>
                  <span class="translation-spinner" id="transcriptLangSpinner" aria-label="正在翻译"></span>
                </div>
              </div>
              <div class="transcript-actions">
                <button class="enhance-btn" id="copyTranscriptBtn">Copy</button>
                <button class="enhance-btn" id="exportTranscriptBtn">
                  导出
                </button>
              </div>
            </div>
            <!-- Search stays inside the Transcript tab and never changes playback. -->
            <div class="transcript-search" role="search">
              <svg
                class="transcript-search-icon"
                viewBox="0 0 20 20"
                aria-hidden="true"
              >
                <circle cx="8.5" cy="8.5" r="5.5"></circle>
                <path d="m12.5 12.5 4 4"></path>
              </svg>
              <input
                class="transcript-search-input"
                id="transcriptSearchInput"
                type="search"
                placeholder="搜索词语或短语"
                aria-label="搜索 Transcript"
                aria-controls="transcriptList"
                autocomplete="off"
                spellcheck="false"
              />
              <button
                class="transcript-search-clear"
                id="transcriptSearchClearBtn"
                type="button"
                aria-label="清除 Transcript 搜索"
                title="清除搜索"
                hidden
              >
                &times;
              </button>
              <output
                class="transcript-search-count"
                id="transcriptSearchCount"
                aria-live="polite"
              ></output>
              <div
                class="transcript-search-nav"
                role="group"
                aria-label="搜索结果"
              >
                <button
                  id="transcriptSearchPrevBtn"
                  type="button"
                  aria-label="上一个 Transcript 匹配项"
                  title="上一个匹配项（Shift + Enter）"
                  disabled
                >
                  &#8593;
                </button>
                <button
                  id="transcriptSearchNextBtn"
                  type="button"
                  aria-label="下一个 Transcript 匹配项"
                  title="下一个匹配项（Enter）"
                  disabled
                >
                  &#8595;
                </button>
              </div>
            </div>
            <div id="transcriptList"></div>
          </div>
        </div>

        <!-- TAB: Overview (chapters + key quotes) - requires LLM -->
        <div class="tab-panel" data-panel="overview">
          <div class="tab-language-header">
            <div class="section-title">Overview</div>
            <div
              class="transcript-mode-control"
              id="overviewModeControl"
              role="group"
              aria-label="Overview 显示语言"
              data-language-surface="overview"
            >
              <button class="transcript-mode-btn active" type="button" data-transcript-mode="original" aria-pressed="true">Original</button>
              <button class="transcript-mode-btn" type="button" data-transcript-mode="zh" aria-pressed="false">中文</button>
              <button class="transcript-mode-btn" type="button" data-transcript-mode="bilingual" aria-pressed="false">双语</button>
              <span class="translation-spinner" id="overviewLangSpinner" aria-label="正在翻译"></span>
            </div>
          </div>
          <!-- Chapters -->
          <div class="section">
            <div class="section-title">章节</div>
            <ul class="chapter-list" id="chapterList">
              <li
                class="chapter-item"
                style="
                  color: var(--text-muted);
                  cursor: default;
                  border-color: var(--border);
                "
              >
                章节将在这里显示
              </li>
            </ul>
          </div>

          <!-- Key Quotes -->
          <div class="section">
            <div class="section-title">重点引用</div>
            <div id="quotesList">
              <div
                class="quote-item"
                style="
                  color: var(--text-muted);
                  border-left-color: var(--border);
                  cursor: default;
                "
              >
                <div class="quote-text" style="font-style: normal">
                  查看此标签页时将提取重点引用……
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- TAB: Notes -->
        <div class="tab-panel" data-panel="notes">
          <div class="section">
            <div class="section-header">
              <div class="section-title-wrap">
                <div class="section-title">已保存笔记</div>
                <div
                  class="transcript-mode-control"
                  id="notesModeControl"
                  role="group"
                  aria-label="Notes 显示语言"
                  data-language-surface="notes"
                >
                  <button class="transcript-mode-btn active" type="button" data-transcript-mode="original" aria-pressed="true">Original</button>
                  <button class="transcript-mode-btn" type="button" data-transcript-mode="zh" aria-pressed="false">中文</button>
                  <button class="transcript-mode-btn" type="button" data-transcript-mode="bilingual" aria-pressed="false">双语</button>
                  <span class="translation-spinner" id="notesLangSpinner" aria-label="正在翻译"></span>
                </div>
              </div>
              <div class="notes-filter">
                <button
                  class="enhance-btn active"
                  id="notesFilterThis"
                  aria-pressed="true"
                >
                  当前视频
                </button>
                <button
                  class="enhance-btn"
                  id="notesFilterAll"
                  aria-pressed="false"
                >
                  全部笔记
                </button>
              </div>
            </div>
            <p class="notes-intro" id="notesIntro">
              将鼠标移到视频上并点击“笔记”，即可保存带时间点的笔记；也可以在视频获得焦点时按“n”键。
            </p>
            <div id="notesList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Auto-scroll follow button — appears when user scrolls away from playback position -->
    <button
      class="follow-playback-btn"
      id="followPlaybackBtn"
      style="display: none"
    >
      跟随播放进度
    </button>

    <script src="settings.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
